appId: com.fatebound.app
productName: Fatebound
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!resources/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - from: resources
    to: resources
    filter:
      - icon.png
      - branding/*.png
      - branding/*.ico
win:
  target:
    - target: portable
      arch:
        - x64
  executableName: Fatebound
  icon: build/icon.ico
portable:
  artifactName: Fatebound.${ext}
  requestExecutionLevel: user
npmRebuild: false
